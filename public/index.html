<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Check-in</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- TELA 1: Login -->
    <div id="tela-login" class="tela ativa">
        <div class="card">
            <h1>🏋️ Academia Check-in</h1>
            <p class="subtitulo">Faça login para continuar</p>
            <form id="form-login">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="••••••••" required>
                </div>
                <div id="erro-login" class="mensagem erro hidden"></div>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>
        </div>
    </div>

    <!-- TELA 2: Painel do Aluno -->
    <div id="tela-aluno" class="tela hidden">
        <div class="card">
            <div class="header-painel">
                <div>
                    <h2>Olá, <span id="nome-aluno"></span>! 👋</h2>
                    <p class="subtitulo">Plano: <span id="status-plano" class="badge"></span></p>
                </div>
                <button id="btn-logout-aluno" class="btn-logout">Sair</button>
            </div>
            <hr>
            <div id="area-checkin">
                <p class="instrucao">Clique abaixo para registrar sua entrada hoje.</p>
                <button id="btn-checkin" class="btn-primary btn-grande">✅ Fazer Check-in</button>
            </div>
            <div id="resultado-checkin" class="mensagem hidden"></div>
        </div>
    </div>

    <!-- TELA 3: Painel da Recepção -->
    <div id="tela-recepcao" class="tela hidden">
        <div class="card">
            <div class="header-painel">
                <div>
                    <h2>Recepção 🏢</h2>
                    <p class="subtitulo">Check-ins de hoje e recentes</p>
                </div>
                <button id="btn-logout-recepcao" class="btn-logout">Sair</button>
            </div>
            <hr>
            <table id="tabela-checkins">
                <thead>
                    <tr>
                        <th>Aluno</th>
                        <th>E-mail</th>
                        <th>Data</th>
                        <th>Hora</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela"></tbody>
            </table>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
